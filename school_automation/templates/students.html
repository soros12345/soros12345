<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students List</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .actions a {
            margin-right: 10px;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Students</h1>
    <p><a href="{{ url_for('add_student') }}">Add New Student</a></p>

    {% if students %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.email }}</td>
                    <td class="actions">
                        <a href="{{ url_for('edit_student', student_id=student.id) }}">Edit</a>
                        <form action="{{ url_for('delete_student', student_id=student.id) }}" method="post" style="display:inline;">
                            <button type="submit" onclick="return confirm('Are you sure you want to delete this student?');">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="message">No students found.</p>
    {% endif %}
    <hr>
    <p>
        <a href="{{ url_for('home') }}">Home</a> | 
        <a href="{{ url_for('list_courses') }}">Manage Courses</a>
    </p>
</body>
</html>
