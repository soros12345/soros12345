<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: sans-serif;
        }
        .container {
            width: 50%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            height: 80px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .back-link {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <form method="post" action="{{ action_url }}">
            <div>
                <label for="name">Course Name:</label>
                <input type="text" id="name" name="name" value="{{ course.name if course else '' }}" required>
            </div>
            <div>
                <label for="description">Description:</label>
                <textarea id="description" name="description" required>{{ course.description if course else '' }}</textarea>
            </div>
            <div>
                <label for="teacher_id">Teacher:</label>
                <select name="teacher_id" id="teacher_id">
                    <option value="">-- Select Teacher --</option>
                    {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" {% if course and course.teacher_id == teacher.id %}selected{% endif %}>
                            {{ teacher.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <input type="submit" value="{{ submit_button_text }}">
            </div>
        </form>
        <hr>
        <p>
            <a href="{{ url_for('list_courses') }}" class="back-link">Back to Course List</a> |
            <a href="{{ url_for('home') }}" class="back-link">Home</a> |
            <a href="{{ url_for('list_students') }}" class="back-link">Manage Students</a> |
            <a href="{{ url_for('list_teachers') }}" class="back-link">Manage Teachers</a>
        </p>
    </div>
</body>
</html>
